<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Auto redirect after 4 seconds -->
    <meta http-equiv="refresh" content="4; url=index.html">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Below Water | Splash</title>

    <!-- Google Font (same as main site) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        /* FULL PAGE SETUP */
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            background: url('images/background.jpeg') center/cover no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        /* GLASS STYLE CONTAINER (match your site design) */
        .overlay {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 50px 60px;
            text-align: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            max-width: 500px;
        }

        /* TITLE STYLING (match your logo text style) */
        h1 {
            margin: 0;
            font-size: 2.8rem;
            letter-spacing: 2px;
        }

        p {
            margin: 12px 0;
            font-weight: 300;
        }

        /* LOADER (cleaner look) */
        .loader {
            margin: 25px auto;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #6e9cf8; /* matches your theme */
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* COUNTDOWN TEXT */
        #countdown {
            font-size: 1rem;
            margin-top: 10px;
        }

        /* SKIP BUTTON (match site colors) */
        .skip-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: rgba(110, 156, 248, 0.8);
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .skip-btn:hover {
            background: rgba(110, 156, 248, 1);
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="overlay">

        <!-- WEBSITE TITLE -->
        <h1>LIFE BELOW WATER</h1>

        <!-- MISSION -->
        <p>Empowering individuals to protect marine life through everyday actions and sustainable choices.</p>

        <!-- GROUP MEMBERS -->
        <p><strong>Group Members</strong></p>
        <p>Vinindu | Janindu | Krishantha | Yoosuf</p>

        <!-- LOADER -->
        <div class="loader"></div>

        <!-- COUNTDOWN -->
        <p id="countdown">Entering site in 4...</p>

        <!-- SKIP BUTTON -->
        <button class="skip-btn" onclick="skipIntro()">Skip Intro</button>

    </div>

    <script>
        let timeLeft = 4;
        const countdownEl = document.getElementById("countdown");

        const timer = setInterval(() => {
            timeLeft--;
            countdownEl.textContent = "Entering site in " + timeLeft + "...";

            if (timeLeft === 0) {
                clearInterval(timer);
            }
        }, 1000);

        function skipIntro() {
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
