<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Auto redirect after 4 seconds -->
    <meta http-equiv="refresh" content="4; url=index.html">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Below Water | Splash</title>

    <!-- Google Font (same as main site) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

   <link rel="stylesheet" href="../stylings/splash.css">
</head>

<body>

    <div class="overlay">

        <!-- WEBSITE TITLE -->
        <h1>LIFE BELOW WATER</h1>

        <!-- MISSION -->
        <p>Empowering individuals to protect marine life through everyday actions and sustainable choices.</p>

        <!-- GROUP MEMBERS -->
        <p><strong>Group Members</strong></p>
        <p>Vinindu | Janindu | Krishantha | Yoosuf</p>

        <!-- LOADER -->
        <div class="loader"></div>

        <!-- COUNTDOWN -->
        <p id="countdown">Entering site in 4...</p>

        <!-- SKIP BUTTON -->
        <button class="skip-btn" onclick="skipIntro()">Skip Intro</button>

    </div>

    <script>
        let timeLeft = 4;
        const countdownEl = document.getElementById("countdown");

        const timer = setInterval(() => {
            timeLeft--;
            countdownEl.textContent = "Entering site in " + timeLeft + "...";

            if (timeLeft === 0) {
                clearInterval(timer);
            }
        }, 1000);

        function skipIntro() {
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
